[package]
name = "caliptra-mcu-test-fw-mbox-ownership"
version.workspace = true
edition.workspace = true

[features]
default = []
riscv = []
emu = ["caliptra-test-harness?/emu"]
fpga_realtime = ["caliptra-mcu-test-harness?/fpga_realtime"]
core = ["dep:caliptra-drivers", "dep:caliptra-registers", "dep:caliptra-test-harness", "caliptra-test-harness/riscv"]
mcu = ["dep:caliptra-mcu-rom-common", "dep:caliptra-mcu-romtime", "dep:caliptra-mcu-test-harness", "dep:caliptra-mcu-registers-generated"]

[[bin]]
name = "caliptra-mcu-test-fw-mbox-ownership"
path = "src/bin/mcu.rs"
required-features = ["mcu"]
test = false

[[bin]]
name = "caliptra-mcu-test-fw-mbox-ownership-core"
path = "src/bin/core.rs"
required-features = ["core"]
test = false

[dependencies]
cfg-if.workspace = true
caliptra-drivers = { workspace = true, optional = true }
caliptra-registers = { workspace = true, optional = true }
caliptra-test-harness = { workspace = true, optional = true }
caliptra-mcu-rom-common = { workspace = true, optional = true }
caliptra-mcu-romtime = { workspace = true, optional = true }
caliptra-mcu-test-harness = { workspace = true, optional = true }
caliptra-mcu-registers-generated = { workspace = true, optional = true }
tock-registers.workspace = true
zerocopy.workspace = true

[build-dependencies]
caliptra-mcu-hw-revision.workspace = true
