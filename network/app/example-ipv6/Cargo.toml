[package]
name = "lwip-rs-example-ipv6"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "DHCPv6 (stateful) + TFTP over IPv6 boot example application using lwip-rs"

[[bin]]
name = "lwip-rs-example-ipv6"
path = "src/main.rs"

[dependencies]
# Not using workspace dependency: this crate needs lwip-rs with default-features
# (alloc + TAP), which conflicts with baremetal crates via Cargo feature unification.
# This crate is excluded from the workspace and built standalone.
lwip-rs = { path = "../../net/lwip-rs", default-features = true }
